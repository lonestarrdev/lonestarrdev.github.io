  const FILES = [{"group": "Top", "name": "fft_top.v", "path": "rtl_fft/rtl/fft_top/fft_top.v", "code": "`timescale 1ns/1ps\n\nmodule fft_top #(parameter DW = 24) ( //oh boy its timne for a billion inputs\n    input clk,\n    input rst_n,\n    input start,\n    output done,\n    input tb_mode,\n    // bank0 real\n    input tb_b0r_en_a,\n    input tb_b0r_we_a,\n    input [9:0] tb_b0r_addr_a,\n    input [DW-1:0] tb_b0r_din_a,\n    output [DW-1:0] tb_b0r_dout_a,\n    input tb_b0r_en_b,\n    input tb_b0r_we_b,\n    input [9:0] tb_b0r_addr_b,\n    input [DW-1:0] tb_b0r_din_b,\n    output [DW-1:0] tb_b0r_dout_b,\n\n    // ank0 imag\n    input tb_b0i_en_a,\n    input tb_b0i_we_a,\n    input [9:0] tb_b0i_addr_a,\n    input [DW-1:0] tb_b0i_din_a,\n    output [DW-1:0] tb_b0i_dout_a,\n    input tb_b0i_en_b,\n    input tb_b0i_we_b,\n    input [9:0] tb_b0i_addr_b,\n    input [DW-1:0] tb_b0i_din_b,\n    output [DW-1:0] tb_b0i_dout_b,\n\n    // bank1 real\n    input tb_b1r_en_a,\n    input tb_b1r_we_a,\n    input [9:0] tb_b1r_addr_a,\n    input [DW-1:0] tb_b1r_din_a,\n    output [DW-1:0] tb_b1r_dout_a,\n\n    input tb_b1r_en_b,\n    input tb_b1r_we_b,\n    input [9:0] tb_b1r_addr_b,\n    input [DW-1:0] tb_b1r_din_b,\n    output [DW-1:0] tb_b1r_dout_b,\n\n    // bank1 imag\n    input tb_b1i_en_a,\n    input tb_b1i_we_a,\n    input [9:0] tb_b1i_addr_a,\n    input [DW-1:0] tb_b1i_din_a,\n    output [DW-1:0] tb_b1i_dout_a,\n\n    input tb_b1i_en_b,\n    input tb_b1i_we_b,\n    input [9:0] tb_b1i_addr_b,\n    input [DW-1:0] tb_b1i_din_b,\n    output [DW-1:0] tb_b1i_dout_b,\n\n    // twi dreal\n    input tb_twr_en,\n    input tb_twr_we,\n    input [8:0] tb_twr_addr,\n    input [15:0] tb_twr_din,\n    output [15:0] tb_twr_dout,\n\n    //twidle imag\n    input tb_twi_en,\n    input tb_twi_we,\n    input [8:0] tb_twi_addr,\n    input [15:0] tb_twi_din,\n    output [15:0] tb_twi_dout\n);\n\n    wire done_w;\n    wire bank_sel; //for bank swithcing\n    assign done = done_w;\n\n    // ALL OF controller\n    wire src_en_a, src_we_a, src_en_b, src_we_b;\n    wire [9:0] src_addr_a, src_addr_b;\n    wire dst_en_a, dst_we_a, dst_en_b, dst_we_b;\n    wire [9:0] dst_addr_a, dst_addr_b;\n    wire [DW-1:0] dst_din_a_re, dst_din_a_im;\n    wire [DW-1:0] dst_din_b_re, dst_din_b_im;\n    wire tw_en, tw_we;\n    wire [8:0] tw_addr;\n    wire [15:0] tw_din;\n\n    // sram drve\n    reg b0r_en_a_r, b0r_we_a_r, b0r_en_b_r, b0r_we_b_r;\n    reg [9:0] b0r_addr_a_r, b0r_addr_b_r;\n    reg [DW-1:0] b0r_din_a_r, b0r_din_b_r;\n    reg b0i_en_a_r, b0i_we_a_r, b0i_en_b_r, b0i_we_b_r;\n    reg [9:0] b0i_addr_a_r, b0i_addr_b_r;\n    reg [DW-1:0] b0i_din_a_r, b0i_din_b_r;\n    reg b1r_en_a_r, b1r_we_a_r, b1r_en_b_r, b1r_we_b_r;\n    reg [9:0] b1r_addr_a_r, b1r_addr_b_r;\n    reg [DW-1:0] b1r_din_a_r, b1r_din_b_r;\n    reg b1i_en_a_r, b1i_we_a_r, b1i_en_b_r, b1i_we_b_r;\n    reg [9:0] b1i_addr_a_r, b1i_addr_b_r;\n    reg [DW-1:0] b1i_din_a_r, b1i_din_b_r;\n//last twids\n    reg twr_en_r, twr_we_r;\n    reg [8:0] twr_addr_r;\n    reg [15:0] twr_din_r;\n    reg twi_en_r, twi_we_r;\n    reg [8:0] twi_addr_r;\n    reg [15:0] twi_din_r;\n\n    // sram outputs\n    wire [DW-1:0] b0r_qa, b0r_qb;\n    wire [DW-1:0] b0i_qa, b0i_qb;\n    wire [DW-1:0] b1r_qa, b1r_qb;\n    wire [DW-1:0] b1i_qa, b1i_qb;\n    wire [15:0] twr_q, twi_q;\n\n    // sel back to contro\n    wire [DW-1:0] src_dout_a_re, src_dout_a_im;\n    wire [DW-1:0] src_dout_b_re, src_dout_b_im;\n    wire [15:0] tw_dout_re, tw_dout_im;\n//sram no worky :(\n    reg b0r_en_a_pre, b0r_we_a_pre;\n    reg [9:0] b0r_addr_a_pre;\n    reg [DW-1:0] b0r_din_a_pre;\n\n    reg b1r_en_a_pre, b1r_we_a_pre;\n    reg [9:0] b1r_addr_a_pre;\n    reg [DW-1:0] b1r_din_a_pre;\n\n    reg b0i_en_a_pre, b0i_we_a_pre;\n    reg [9:0] b0i_addr_a_pre;\n    reg [DW-1:0] b0i_din_a_pre;\n\n    reg b1i_en_a_pre, b1i_we_a_pre;\n    reg [9:0] b1i_addr_a_pre;\n    reg [DW-1:0] b1i_din_a_pre;\n\n//b set\n    reg b0r_en_b_pre, b0r_we_b_pre;\n    reg [9:0] b0r_addr_ , .addr_a (b0r_addr_a_r), .din_a (b0r_din_a_r), .dout_a (b0r_qa),\n        .clk_b (clk), .en_b (b0r_en_b_r), .we_b (b0r_we_b_r), .addr_b (b0r_addr_b_r), .din_b (b0r_din_b_r), .dout_b (b0r_qb));\n\n    sram_imag_bank0_wrapper imag0u (\n        .clk_a (clk), .en_a (b0i_en_a_r), .we_a (b0i_we_a_r), .addr_a (b0i_addr_a_r), .din_a (b0i_din_a_r), .dout_a (b0i_qa),\n        .clk_b (clk), .en_b (b0i_en_b_r), .we_b (b0i_we_b_r), .addr_b (b0i_addr_b_r), .din_b (b0i_din_b_r), .dout_b (b0i_qb));\n\n    sram_real_bank1_wrapper real1u (\n        .clk_a (clk), .en_a (b1r_en_a_r), .we_a (b1r_we_a_r), .addr_a (b1r_addr_a_r), .din_a (b1r_din_a_r), .dout_a (b1r_qa),\n        .clk_b (clk), .en_b (b1r_en_b_r), .we_b (b1r_we_b_r), .addr_b (b1r_addr_b_r), .din_b (b1r_din_b_r), .dout_b (b1r_qb));\n\n    sram_imag_bank1_wrapper imag1u (\n        .clk_a (clk), .en_a (b1i_en_a_r), .we_a (b1i_we_a_r), .addr_a (b1i_addr_a_r), .din_a (b1i_din_a_r), .dout_a (b1i_qa),\n        .clk_b (clk), .en_b (b1i_en_b_r), .we_b (b1i_we_b_r), .addr_b (b1i_addr_b_r), .din_b (b1i_din_b_r), .dout_b (b1i_qb));\n\n    twiddle_bank0_wrapper twidreal (\n        .clk(clk), .en(twr_en_r), .we(twr_we_r), .addr(twr_addr_r), .din(twr_din_r), .dout(twr_q));\n\n    twiddle_bank1_wrapper twidimag (\n        .clk(clk), .en(twi_en_r), .we(twi_we_r), .addr(twi_addr_r), .din(twi_din_r), .dout(twi_q));\n\n    assign tb_b0r_dout_a = b0r_qa;\n    assign tb_b0r_dout_b = b0r_qb;\n    assign tb_b0i_dout_a = b0i_qa;\n    assign tb_b0i_dout_b = b0i_qb;\n    assign tb_b1r_dout_a = b1r_qa;\n    assign tb_b1r_dout_b = b1r_qb;\n    assign tb_b1i_dout_a = b1i_qa;\n    assign tb_b1i_dout_b = b1i_qb;\n    assign tb_twr_dout = twr_q;\n    assign tb_twi_dout = twi_q;\n\nendmodule\n"}, {"group": "Control", "name": "fft_controller.v", "path": "rtl_fft/rtl/fft_controller/fft_controller.v", "code": "`timescale 1ns/1ps\n\nmodule fft_controller #(parameter DW = 24)(\n    input clk,\n    input rst_n,\n    input start,\n    output reg done,\n\n    output reg src_en_a,\n    output reg [9:0] src_addr_a,\n    input [DW-1:0] src_dout_a_re,\n    input [DW-1:0] src_dout_a_im,\n    output reg src_en_b,\n    output reg [9:0] src_addr_b,\n    input [DW-1:0] src_dout_b_re,\n    input [DW-1:0] src_dout_b_im,\n\n    output reg dst_en_a,\n    output reg dst_we_a,\n    output reg [9:0] dst_addr_a,\n    output reg [DW-1:0] dst_din_a_re,\n    output reg [DW-1:0] dst_din_a_im,\n    output reg dst_en_b,\n    output reg dst_we_b,\n    output reg [9:0] dst_addr_b,\n    output reg [DW-1:0] dst_din_b_re,\n    output reg [DW-1:0] dst_din_b_im,\n\n    output reg tw_en,\n    output reg tw_we,\n    output reg [8:0] tw_addr,\n    output reg [15:0] tw_din,\n    input [15:0] tw_dout_re,\n    input [15:0] tw_dout_im,\n    output reg bank_sel\n);\n//states\n/*\n    localparam S_IDLE = 3'd0;\n    localparam S_RD_REQ = 3'd1;\n    localparam S_RD_WAIT0 = 3'd2;\n    localparam S_RD_WAIT1 = 3'd3;\n    localparam S_LATCH = 3'd4;\n    localparam S_WR_REQ = 3'd5;\n    localparam S_WR_WAIT  = 3'd6;\n    localparam S_ADV = 3'd7;*/\n\tlocalparam S_IDLE     = 4'd0;\n\tlocalparam S_RD_REQ   = 4'd1;\n\tlocalparam S_RD_WAIT0 = 4'd2;\n\tlocalparam S_RD_WAIT1 = 4'd3;\n\tlocalparam S_RD_WAIT2 = 4'd4;\n\tlocalparam S_LATCH    = 4'd5;\n\tlocalparam S_WR_REQ   = 4'd6;\n\tlocalparam S_WR_WAIT = 4'd7;\n\tlocalparam S_WR_WAIT1 = 4'd8;\n\tlocalparam S_ADV      = 4'd9;\n\nreg [3:0] state, next_state;\n\n //   reg [2:0] state, next_state;\n//stages for scaling down\n    reg [3:0] stage;\n    reg [8:0] butterfly_idx;\n\n    wire [9:0] a_addr;\n    wire [9:0] b_addr;\n    wire [8:0] tw_addr_w;\n\n    reg signed [DW-1:0] a_re_reg, a_im_reg;\n    reg signed [DW-1:0] b_re_reg, b_im_reg;\n    reg signed [15:0] w_re_reg, w_im_reg;\n\treg [9:0] a_addr_req_reg, b_addr_req_reg;\n\treg [8:0] tw_addr_req_reg;\n    wire signed [DW-1:0] y0_re, y0_im, y1_re, y1_im;\n\n    wire last_bfly  = (butterfly_idx == 9'd511);\n    wire last_stage = (stage == 4'd9);\n\n    fft_addr_gen addrgeninst (.stage(stage),.butterfly_idx(butterfly_idx),.a_addr(a_addr),.b_addr(b_addr),.tw_addr(tw_addr_w));\n\n    fft_butterfly #(.dw(DW),.tw(16)) butterflyinst (\n        .stage(stage),.a_re(a_re_reg),.a_im(a_im_reg),.b_re(b_re_reg),.b_im(b_im_reg),.w_re(w_re_reg),.w_im(w_im_reg),.y0_re(y0_re),.y0_im(y0_im),\n        .y1_re(y1_re),.y1_im(y1_im));\n//reset\n    always @(posedge clk or negedge rst_n) begin\n        if (!rst_n)\n            state <= S_IDLE;\n        else\n            state <= next_state;\n    end\n//next state logic\n    always @(*) begin\n        next_state = state;\n        case (state)\n            S_IDLE: if (start) next_state = S_RD_REQ;\n            S_RD_REQ: next_state = S_RD_WAIT0;\n            S_RD_WAIT0: next_state = S_RD_WAIT1;\n            S_RD_WAIT1: next_state = S_RD_WAIT2;\n\t    S_RD_WAIT2: next_state = S_LATCH;\n            S_LATCH: next_state = S_WR_REQ;\n            S_WR_REQ: next_state = S_WR_WAIT;\n            S_WR_WAIT: next_state = S_WR_WAIT1;\n\t    S_WR_WAIT1: next_state = S_ADV;\n            S_ADV: if (last_stage && last_bfly) next_state = S_IDLE;\n                        else next_state = S_RD_REQ;\n            default: next_state = S_IDLE;\n        endcase\n    end\n//state variable states\n    always @(posedge clk or negedge rst_n) begin\n        if (!rst_n) begin\n            stage <= 4'd0;\n            butterfly_idx <= 9'd0;\n            bank_sel <= 1'b0;\n            done <= 1'b0;\n\n            a_re_reg <= {DW{1'b0}};\n            a_im_reg <= {DW{1'b0}};\n            b_re_reg <= {DW{1'b0}};\n            b_im_reg <= {DW{1'b0}};\n            w_re_reg <= 16'sd0;\n            w_im_reg <= 16'sd0;\n        end else begin\n            done <= 1'b0;\n\n            case (state)\n                S_IDLE: begin\n                    if (start) begin\n                        stage <= 4'd0;\n                        butterfly_idx <= 9'd0;\n                        bank_sel <= 1'b0;\n                    end\n                end\n\n                S_LATCH: begin\n                    a_re_reg <= src_dout_a_re;\n                    a_im_reg <= src_dout_a_im;\n                    b_re_reg <= src_dout_b_re;\n                    b_im_reg <= src_dout_b_im;\n                    w_re_reg <= tw_dout_re;\n                    w_im_reg <= tw_dout_im;\n                end\n\n                S_ADV: begin\n                    if (last_bfly) begin\n                        butterfly_idx <= 9'd0;\n                        if (last_stage) begin\n                            done <= 1'b1;\n                        end else begin\n                            stage <= stage + 4'd1;\n                            bank_sel <= ~bank_sel;\n                        end\n                    end else begin\n                        butterfly_idx <= butterfly_idx + 9'd1;\n                    end\n                end\n            endcase\n        end\n    end\n\n    always @(*) begin\n        src_en_a = 1'b0;\n        src_addr_a = 10'd0;\n\n        src_en_b = 1'b0;\n        src_addr_b = 10'd0;\n\n        dst_en_a = 1'b0;\n        dst_we_a = 1'b0;\n        dst_addr_a = 10'd0;\n        dst_din_a_re = {DW{1'b0}};\n        dst_din_a_im = {DW{1'b0}};\n\n        dst_en_b = 1'b0;\n        dst_we_b = 1'b0;\n        dst_addr_b = 10'd0;\n        dst_din_b_re = {DW{1'b0}};\n        dst_din_b_im = {DW{1'b0}};\n\n        tw_en = 1'b0;\n        tw_we = 1'b0;\n        tw_addr = 9'd0;\n        tw_din = 16'd0;\n\n        case (state)\n\tS_RD_REQ: begin\n\t    a_addr_req_reg <= a_addr;\n\t    b_addr_req_reg <= b_addr;\n\t    tw_addr_req_reg <= tw_addr_w;\n\t\tend\n            S_RD_WAIT0,\n            S_RD_WAIT1,\n\t    S_RD_WAIT2,\n            S_LATCH: begin\n                src_en_a = 1'b1;\n                src_addr_a = a_addr;\n\n                src_en_b = 1'b1;\n                src_addr_b = b_addr;\n\n                tw_en = 1'b1;\n                tw_we = 1'b0;\n                tw_addr = tw_addr_w;\n            end\n\n            S_WR_REQ, S_WR_WAIT: begin\n                dst_en_a = 1'b1;\n                dst_we_a = 1'b1;\n                dst_addr_a = a_addr;\n                dst_din_a_re = y0_re;\n                dst_din_a_im = y0_im;\n\n                dst_en_b = 1'b1;\n                dst_we_b = 1'b1;\n                dst_addr_b = b_addr;\n                dst_din_b_re = y1_re;\n                dst_din_b_im = y1_im;\n            end\n\t\tS_WR_WAIT1: begin\n\t\tend\n        endcase\n    end\n//jesus christ this took way too long\nendmodule\n"}, {"group": "Control", "name": "fft_addr_gen.v", "path": "rtl_fft/rtl/fft_addr_gen/fft_addr_gen.v", "code": "`timescale 1ns/1ps\n\nmodule fft_addr_gen (input [3:0] stage,input [8:0] butterfly_idx,output reg [9:0] a_addr,output reg [9:0] b_addr,output reg [8:0] tw_addr);\n\n    reg [9:0] half; //spacinmg for butterfly\n    reg [10:0] m; //size of the fft group\n    reg [8:0] j;\n    reg [8:0] group;\n    reg [10:0] base; //starting addres\n    reg [10:0] stride; //fft step seiz\n//a = X(base + j) and b = X(base + j + half)\n    always @(*) begin\n        half = (10'd1 << stage);\n        m = (11'd1 << (stage + 1));\n        stride = (11'd1024 >> (stage + 1));\n\n        group = butterfly_idx >> stage;\n        j = butterfly_idx & (half - 1);\n\n        base = group * m;\n        a_addr = base + j;\n        b_addr = base + j + half;\n        tw_addr = j * stride;\n    end\n/*always @(*) begin\n    if (stage == 4'd3 && butterfly_idx >= 9'd428 && butterfly_idx <= 9'd435)\n        $display(\" from addrgen stage %0d idx %0d half %0d j %0d stride %0d a %0d b %0d tw %0d\", stage, butterfly_idx, half, j, stride, a_addr, b_addr, tw_addr);\nend */\nendmodule\n"}, {"group": "Datapath", "name": "fft_butterfly.v", "path": "rtl_fft/rtl/fft_butterfly/fft_butterfly.v", "code": "`timescale 1ns/1ps\n\nmodule fft_butterfly #(\n    parameter dw = 24,\n    parameter tw = 16\n)( //inputs\n    input signed [dw-1:0]a_re,\n    input signed [dw-1:0]a_im,\n    input signed [dw-1:0]b_re,\n    input signed [dw-1:0]b_im,\n    input signed [tw-1:0]w_re,\n    input signed [tw-1:0]w_im,\n    input [3:0] stage,\n\n    output signed [dw-1:0]y0_re,\n    output signed [dw-1:0]y0_im,\n    output signed [dw-1:0]y1_re,\n    output signed [dw-1:0]y1_im\n);\n\n    wire signed [dw+tw-1:0]bw_re_re, bw_im_im, bw_re_im, bw_im_re;\n    wire signed [dw+tw:0] twiddled_b_re_wide, twiddled_b_im_wide;\n    wire signed [dw:0] twiddled_b_re, twiddled_b_im;\n    wire signed [dw:0] out0_re_wide, out0_im_wide, out1_re_wide, out1_im_wide;\n    wire signed [dw:0] out0_re_scaled, out0_im_scaled, out1_re_scaled, out1_im_scaled;\n    wire do_scale;\n\t//rounding func may delete if not needed?\n    function signed [dw:0]round_q15;\n        input signed [dw+tw:0]x;\n        reg signed [dw+tw:0]bias;\n        begin\n            if (x[dw+tw])\n                bias = -($signed(1) <<< (tw-2));\n            else\n                bias =($signed(1) <<< (tw-2));\n\n            round_q15 =(x + bias) >>> (tw-1);\n        end\n    endfunction\n//output sat func\n//added bc truncation was killing itself and killing me\n    function signed [dw-1:0]satdw;\n        input signed [dw:0]x;\n        begin\n            if (x > $signed({1'b0, {(dw-1){1'b1}}}))\n                satdw = {1'b0, {(dw-1){1'b1}}};\n            else if (x < -($signed(1'b1) <<< (dw-1)))\n                satdw = {1'b1, {(dw-1){1'b0}}};\n            else\n                satdw = x[dw-1:0];\n        end\n    endfunction\n//multiplication for butterfly\n    assign bw_re_re = b_re * w_re;\n    assign bw_im_im = b_im * w_im;\n    assign bw_re_im = b_re * w_im;\n    assign bw_im_re = b_im * w_re;\n    assign twiddled_b_re_wide = bw_re_re - bw_im_im;\n    assign twiddled_b_im_wide = bw_re_im + bw_im_re;\n// integer k;\n    assign twiddled_b_re = round_q15(twiddled_b_re_wide);\n    assign twiddled_b_im = round_q15(twiddled_b_im_wide);\n    assign out0_re_wide = a_re + twiddled_b_re;\n    assign out0_im_wide = a_im + twiddled_b_im;\n    assign out1_re_wide = a_re - twiddled_b_re;\n    assign out1_im_wide = a_im - twiddled_b_im;\n    assign do_scale = 1'b0;\n//assign do_scale = (stage >= 4'd8);\n// always @(*) begin\n//     if (stage == 4'd9) begin\n//     end\n// end\n//scaling for overflow\n//solved with expadning to 24 btis\n    assign out0_re_scaled = do_scale ? (out0_re_wide >>> 1) : out0_re_wide;\n    assign out0_im_scaled = do_scale ? (out0_im_wide >>>1) : out0_im_wide;\n    assign out1_re_scaled = do_scale ? (out1_re_wide >>> 1) : out1_re_wide;\n    assign out1_im_scaled = do_scale ? (out1_im_wide >>> 1) : out1_im_wide;\n    assign y0_re = out0_re_scaled[dw-1:0];\n    assign y0_im = out0_im_scaled[dw-1:0];\n    assign y1_re = out1_re_scaled[dw-1:0];\n    assign y1_im = out1_im_scaled[dw-1:0];\n    // assign y0_re = satdw(out0_re_scaled);\n    // assign y0_im = satdw(out0_im_scaled);\n    // assign y1_re = satdw(out1_re_scaled);\n    // assign y1_im = satdw(out1_im_scaled);\n\nendmodule\n"}, {"group": "Memory", "name": "sram_controller.v", "path": "rtl_fft/rtl/sram_controller/sram_controller.v", "code": "module sram_controller # (\n    parameter AW = 13\n) (\n    input clk,\n    input rstn,\n    input [7:0] counter_out,\n    output reg sram_cen,\n    output reg sram_gwen,\n    output reg [AW-1:0] sram_addr\n);\n\n    always @(posedge clk or negedge rstn) begin\n        \n        if (!rstn) begin\n            sram_cen <= 1'b1;\n            sram_gwen <= 1'b1;\n            sram_addr <= 0;\n        end else begin\n            if (counter_out == 8'd128) begin\n                // When counter_out is 128, enable the write mode of the sram\n                // this should write the value 127 into the sram address 6\n                sram_cen <= 1'b0;\n                sram_gwen <= 1'b0;\n                sram_addr <= 6;\n            end else if (counter_out == 8'd1) begin\n                // When counter_out is 1, enable the read mode of the sram\n                // this should read the value 127 from the sram address 6\n                sram_cen <= 1'b1;\n                sram_gwen <= 1'b0;\n                sram_addr <= 6;\n            end else begin\n                sram_cen <= 1'b1;\n                sram_gwen <= 1'b1;\n                sram_addr <= 0;\n            end\n        end\n    \n    end\n\nendmodule\n"}, {"group": "Memory", "name": "sram_wrapper.v", "path": "rtl_fft/rtl/sram_wrapper/sram_wrapper.v", "code": "`timescale 1ns/1ps\n`define DELAY #1\n\nmodule sram_wrapper # (\n    parameter DW = 32,\n    parameter AW = 9\n) (\n    input clk,\n    input cen,\n    input gwen,\n    input [AW-1:0] addr,\n    input [DW-1:0] din,\n    output [DW-1:0] dout\n);\n\n    wire cen_delayed;\n    wire gwen_delayed;\n    wire [AW-1:0] addr_delayed;\n    wire [DW-1:0] din_delayed;\n   \n    assign `DELAY cen_delayed = cen;\n    assign `DELAY gwen_delayed = gwen;\n    assign `DELAY addr_delayed = addr;\n    assign `DELAY din_delayed = din;\n\n    wire [31:0] w_dout;\n    assign dout = w_dout[DW-1:0];\n\n    sram00 sram00_inst (\n        .CLK(clk),\n        .CEN(cen_delayed),\n        .GWEN(gwen_delayed),\n        .WEN(4'b0000),\n        .A(addr_delayed),\n        .D({din_delayed}),\n        .EMA(3'b000),\n        .RETN(1'b1),\n        .Q(w_dout)\n    );\n\n\nendmodule\n"}, {"group": "Memory", "name": "sram_real_bank0_wrapper.v", "path": "rtl_fft/rtl/sram_wrapper_banks/sram_real_bank0_wrapper.v", "code": "`timescale 1ns/1ps\n\nmodule sram_real_bank0_wrapper (input clk_a, input en_a, input we_a, input [9:0] addr_a,\n input [23:0] din_a, output [23:0] dout_a, input clk_b, input en_b, input we_b, input [9:0] addr_b, input [23:0] din_b, output [23:0] dout_b);\n\twire clk_a_sram;\n\twire clk_b_sram;\n\n\tassign #1 clk_a_sram = clk_a;\n\tassign #1 clk_b_sram = clk_b;\n\twire cena;\n\twire wena;\n\twire cenb;\n\twire wenb;\n\n\tassign cena = ~en_a;\n\tassign wena = ~we_a;\n\tassign cenb = ~en_b;\n\tassign wenb = ~we_b;\n\n\n\tdata_real_bank0 u_sram (\n\t.QA (dout_a),.QB (dout_b),.CLKA (clk_a_sram),.CENA (cena),.WENA (wena),.AA (addr_a),.DA (din_a),.CLKB (clk_b_sram),\n\t.CENB (cenb),.WENB (wenb),.AB (addr_b),.DB (din_b),.EMAA (3'b000),.EMAB (3'b000),.RETN (1'b1)\n\t);/*\nbehav_dp_1024x24 #(.DW(24)) u_sram (\n    .clk_a(clk_a),\n    .en_a(en_a),\n    .we_a(we_a),\n    .addr_a(addr_a),\n    .din_a(din_a),\n    .dout_a(dout_a),\n\n    .clk_b(clk_b),\n    .en_b(en_b),\n    .we_b(we_b),\n    .addr_b(addr_b),\n    .din_b(din_b),\n    .dout_b(dout_b)\n);\n*/\nendmodule\n"}, {"group": "Memory", "name": "sram_real_bank1_wrapper.v", "path": "rtl_fft/rtl/sram_wrapper_banks/sram_real_bank1_wrapper.v", "code": "`timescale 1ns/1ps\n\nmodule sram_real_bank1_wrapper (input clk_a, input en_a, input we_a, input [9:0] addr_a,\n input [23:0] din_a, output [23:0] dout_a, input clk_b, input en_b, input we_b, input [9:0] addr_b, input [23:0] din_b, output [23:0] dout_b);\n\twire clk_a_sram;\n\twire clk_b_sram;\n\n\tassign #1 clk_a_sram = clk_a;\n\tassign #1 clk_b_sram = clk_b;\n\twire cena;\n\twire wena;\n\twire cenb;\n\twire wenb;\n\n\tassign cena = ~en_a;\n\tassign wena = ~we_a;\n\tassign cenb = ~en_b;\n\tassign wenb = ~we_b;\n\tdata_real_bank1 u_sram (\n\t.QA (dout_a),.QB (dout_b),.CLKA (clk_a_sram),.CENA (cena),.WENA (wena),.AA (addr_a),.DA (din_a),.CLKB (clk_b_sram),\n\t.CENB (cenb),.WENB (wenb),.AB (addr_b),.DB (din_b),.EMAA (3'b000),.EMAB (3'b000),.RETN (1'b1)\n\t);/*\n\nbehav_dp_1024x24 #(.DW(24)) u_sram (\n    .clk_a(clk_a),\n    .en_a(en_a),\n    .we_a(we_a),\n    .addr_a(addr_a),\n    .din_a(din_a),\n    .dout_a(dout_a),\n\n    .clk_b(clk_b),\n    .en_b(en_b),\n    .we_b(we_b),\n    .addr_b(addr_b),\n    .din_b(din_b),\n    .dout_b(dout_b)\n);\n*/\nendmodule\n"}, {"group": "Memory", "name": "sram_imag_bank0_wrapper.v", "path": "rtl_fft/rtl/sram_wrapper_banks/sram_imag_bank0_wrapper.v", "code": "`timescale 1ns/1ps\n\nmodule sram_imag_bank0_wrapper (input clk_a, input en_a, input we_a, input [9:0] addr_a,\n input [23:0] din_a, output [23:0] dout_a, input clk_b, input en_b, input we_b, input [9:0] addr_b, input [23:0] din_b, output [23:0] dout_b);\n\twire clk_a_sram;\n\twire clk_b_sram;\n\n\tassign #1 clk_a_sram = clk_a;\n\tassign #1 clk_b_sram = clk_b;\n\twire cena;\n\twire wena;\n\twire cenb;\n\twire wenb;\n\n\tassign cena = ~en_a;\n\tassign wena = ~we_a;\n\tassign cenb = ~en_b;\n\tassign wenb = ~we_b;\n\n\tdata_imag_bank0 u_sram (\n\t.QA (dout_a),.QB (dout_b),.CLKA (clk_a_sram),.CENA (cena),.WENA (wena),.AA (addr_a),.DA (din_a),.CLKB (clk_b_sram),\n\t.CENB (cenb),.WENB (wenb),.AB (addr_b),.DB (din_b),.EMAA (3'b000),.EMAB (3'b000),.RETN (1'b1)\n\t);/*\n\tbehav_dp_1024x24 #(.DW(24)) u_sram (\n\t.clk_a(clk_a),\n\t.en_a(en_a),\n\t.we_a(we_a),\n\t.addr_a(addr_a),\n\t.din_a(din_a),\n\t.dout_a(dout_a),\n\n\t.clk_b(clk_b),\n\t.en_b(en_b),\n\t.we_b(we_b),\n\t.addr_b(addr_b),\n\t.din_b(din_b),\n\t.dout_b(dout_b)\n\t);*/\nendmodule\n"}, {"group": "Memory", "name": "sram_imag_bank1_wrapper.v", "path": "rtl_fft/rtl/sram_wrapper_banks/sram_imag_bank1_wrapper.v", "code": "`timescale 1ns/1ps\n\nmodule sram_imag_bank1_wrapper (input clk_a, input en_a, input we_a, input [9:0] addr_a,\n input [23:0] din_a, output [23:0] dout_a, input clk_b, input en_b, input we_b, input [9:0] addr_b, input [23:0] din_b, output [23:0] dout_b);\n\twire clk_a_sram;\n\twire clk_b_sram;\n\n\tassign #1 clk_a_sram = clk_a;\n\tassign #1 clk_b_sram = clk_b;\n\twire cena;\n\twire wena;\n\twire cenb;\n\twire wenb;\n\n\tassign cena = ~en_a;\n\tassign wena = ~we_a;\n\tassign cenb = ~en_b;\n\tassign wenb = ~we_b;\n\n\tdata_imag_bank1 u_sram (\n\t.QA (dout_a),.QB (dout_b),.CLKA (clk_a_sram),.CENA (cena),.WENA (wena),.AA (addr_a),.DA (din_a),.CLKB (clk_b_sram),\n\t.CENB (cenb),.WENB (wenb),.AB (addr_b),.DB (din_b),.EMAA (3'b000),.EMAB (3'b000),.RETN (1'b1)\n\t);/*\n\n\nbehav_dp_1024x24 #(.DW(24)) u_sram (\n    .clk_a(clk_a),\n    .en_a(en_a),\n    .we_a(we_a),\n    .addr_a(addr_a),\n    .din_a(din_a),\n    .dout_a(dout_a),\n\n    .clk_b(clk_b),\n    .en_b(en_b),\n    .we_b(we_b),\n    .addr_b(addr_b),\n    .din_b(din_b),\n    .dout_b(dout_b)\n); */\nendmodule\n"}, {"group": "Memory", "name": "twiddle_bank0_wrapper.v", "path": "rtl_fft/rtl/sram_wrapper_banks/twiddle_bank0_wrapper.v", "code": "`timescale 1ns/1ps\n\nmodule twiddle_bank0_wrapper (input clk, input en, input we,input [8:0]  addr,input [15:0] din, output [15:0] dout\n);\n\n    wire cen;\n    wire wen;\n\n    assign cen = ~en;\n    assign wen = ~we;\n    wire clk_sram;\n    assign #1 clk_sram = clk;\n    twiddle_bank0 u_sram (\n        .Q    (dout),\n        .CLK  (clk_sram),\n        .CEN  (cen),\n        .WEN  (wen),\n        .A    (addr),\n        .D    (din),\n        .EMA  (3'b000),\n        .RETN (1'b1)\n    );/*\nbehav_sp_512x16 u_sram (\n    .clk(clk),\n    .en(en),\n    .we(we),\n    .addr(addr),\n    .din(din),\n    .dout(dout)\n);*/\n\nendmodule\n"}, {"group": "Memory", "name": "twiddle_bank1_wrapper.v", "path": "rtl_fft/rtl/sram_wrapper_banks/twiddle_bank1_wrapper.v", "code": "`timescale 1ns/1ps\n\nmodule twiddle_bank1_wrapper (\n    input             clk,\n    input             en,\n    input             we,\n    input      [8:0]  addr,\n    input      [15:0] din,\n    output     [15:0] dout\n);\n\n    wire cen;\n    wire wen;\n\n    assign cen = ~en;\n    assign wen = ~we;\n    wire clk_sram;\n    assign #1 clk_sram = clk;\n    twiddle_bank1 u_sram (\n        .Q    (dout),\n        .CLK  (clk_sram),\n        .CEN  (cen),\n        .WEN  (wen),\n        .A    (addr),\n        .D    (din),\n        .EMA  (3'b000),\n        .RETN (1'b1)\n    );\n/*\nbehav_sp_512x16 u_sram (\n    .clk(clk),\n    .en(en),\n    .we(we),\n    .addr(addr),\n    .din(din),\n    .dout(dout)\n);*/\nendmodule\n"}, {"group": "Utility", "name": "lfsr1.v", "path": "rtl_fft/rtl/lfsr1/lfsr1.v", "code": "`timescale 1ns/1ps\n\nmodule lfsr1 (input  wire clk,input  wire resetn,input  wire wen,input  wire [15:0] seed,output reg  [15:0] lfsr_out\n);\n\n    wire [15:0] lfsr_next;\n\n    assign lfsr_next = {lfsr_out[14:0],\n                        lfsr_out[15] ^ lfsr_out[12] ^ lfsr_out[5] ^ lfsr_out[0]};\n\n    always @(posedge clk) begin\n        if (!resetn)\n            lfsr_out <= (seed == 16'h0000) ? 16'h0001 : seed;\n        else if (wen)\n            lfsr_out <= lfsr_next;\n    end\n\nendmodule\n"}];

  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function highlightVerilog(src) {
    let code = escapeHtml(src);
    const tokens = [];
    const stash = (html) => { tokens.push(html); return '\u0000' + (tokens.length - 1) + '\u0000'; };

    code = code.replace(/(\/\/[^\n]*)|(\/\*[\s\S]*?\*\/)/g, m => stash('<span class="tok-comment">' + m + '</span>'));
    code = code.replace(/&quot;(?:[^&\\]|\\.)*&quot;/g, m => stash('<span class="tok-string">' + m + '</span>'));
    code = code.replace(/\b\d+'[bBhHdDoO][0-9a-fA-Fxz_XZ]+|\b\d+\.\d+\b|\b\d+\b/g, m => stash('<span class="tok-number">' + m + '</span>'));

    const keywords = ['module','endmodule','input','output','inout','wire','reg','logic','parameter','localparam',
      'always','always_ff','always_comb','always_latch','begin','end','if','else','case','casex','casez','endcase',
      'default','assign','function','endfunction','task','endtask','posedge','negedge','or','and','not','xor',
      'generate','endgenerate','genvar','for','while','integer','signed','unsigned','initial','typedef','struct',
      'enum','packed','timescale','define'];
    const kwRe = new RegExp('\\b(' + keywords.join('|') + ')\\b', 'g');
    code = code.replace(kwRe, '<span class="tok-kw">$1</span>');

    code = code.replace(/\u0000(\d+)\u0000/g, (_, i) => tokens[Number(i)]);
    return code;
  }

  const fileListEl = document.getElementById('file-list');
  const fileSelectEl = document.getElementById('file-select');
  const curNameEl = document.getElementById('cur-name');
  const curPathEl = document.getElementById('cur-path');
  const gutterEl = document.getElementById('gutter');
  const codeOutEl = document.getElementById('code-output');
  const copyBtn = document.getElementById('copy-btn');

  const groups = [];
  FILES.forEach((f, i) => {
    let g = groups.find(g => g.name === f.group);
    if (!g) { g = { name: f.group, items: [] }; groups.push(g); }
    g.items.push(i);
  });

  groups.forEach(g => {
    const wrap = document.createElement('div');
    wrap.className = 'file-group';
    const h2 = document.createElement('h2');
    h2.textContent = g.name;
    wrap.appendChild(h2);
    g.items.forEach(i => {
      const btn = document.createElement('button');
      btn.className = 'file-btn';
      btn.type = 'button';
      btn.textContent = FILES[i].name;
      btn.dataset.index = i;
      btn.addEventListener('click', () => selectFile(i));
      wrap.appendChild(btn);
    });
    fileListEl.appendChild(wrap);
  });

  FILES.forEach((f, i) => {
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = f.group + ' / ' + f.name;
    fileSelectEl.appendChild(opt);
  });
  fileSelectEl.addEventListener('change', () => selectFile(Number(fileSelectEl.value)));

  let currentIndex = 0;

  function selectFile(i) {
    currentIndex = i;
    const f = FILES[i];
    curNameEl.textContent = f.name;
    curPathEl.textContent = f.path;
    codeOutEl.innerHTML = highlightVerilog(f.code);
    const lineCount = f.code.split('\n').length;
    gutterEl.textContent = Array.from({ length: lineCount }, (_, n) => n + 1).join('\n');
    fileListEl.querySelectorAll('.file-btn').forEach(b => b.classList.toggle('active', Number(b.dataset.index) === i));
    fileSelectEl.value = i;
  }

  copyBtn.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(FILES[currentIndex].code);
      copyBtn.textContent = 'Copied';
      setTimeout(() => { copyBtn.textContent = 'Copy'; }, 1400);
    } catch (e) {
      copyBtn.textContent = 'Failed';
      setTimeout(() => { copyBtn.textContent = 'Copy'; }, 1400);
    }
  });

  selectFile(0);
</script>
